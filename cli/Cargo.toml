[package]
name = "light-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Times light switch requests to a device, directly or over the relay"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
iroh = "1.3"
irpc = { version = "0.17", default-features = false, features = ["rpc", "derive", "spans"] }
irpc-iroh = "0.17"
light-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
