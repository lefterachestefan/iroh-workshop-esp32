<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Step 4: button</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Step 4: button</h1>
      <p class="subtitle">Press the BOOT button on the device: the light here follows, live. Protocol version 2 adds watching the light.</p>
      <div class="card">
        <label for="endpoint-id">Endpoint id (from the serial console)</label>
        <input id="endpoint-id" type="text" autocomplete="off" spellcheck="false" />
        <button id="connect" type="button" disabled>connect</button>
      </div>
      <div class="card">
        <div class="light" id="light"></div>
        <div class="row">
          <button id="on" type="button" disabled>on</button>
          <button id="off" type="button" disabled>off</button>
        </div>
        <output id="result" class="result"></output>
      </div>
      <p class="status" id="status">loading…</p>
      <p><a href="./index.html">all steps</a></p>
    </main>
    <script type="module">
      import { lightPage } from "./light.js";
      lightPage({ version: 2, rememberKey: "iroh-workshop:device" });
    </script>
  </body>
</html>
