<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Step 3: light switch</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Step 3: light switch</h1>
      <p class="subtitle">Switch the LED over iroh. The device kept its endpoint id from step 2, so it's already filled in.</p>
      <div class="card" id="connect-form">
        <label for="endpoint-id">Endpoint id (from the serial console)</label>
        <input id="endpoint-id" type="text" autocomplete="off" spellcheck="false" />
        <button id="connect" type="button" disabled>connect</button>
      </div>
      <div class="card connected" id="connected" hidden>
        <span>connected to <code id="peer"></code></span>
        <button id="change" type="button" class="secondary">connect to another</button>
      </div>
      <div class="card light-card" id="light-card" hidden>
        <div class="light" id="light"></div>
        <button id="toggle" type="button" class="switch" role="switch" aria-checked="false">off</button>
      </div>
      <output id="result" class="result"></output>
      <p class="status" id="status">loading…</p>
      <p><a href="./index.html">all steps</a></p>
    </main>
    <script type="module">
      import { lightPage } from "./light.js";
      lightPage({ version: 1, rememberKey: "iroh-workshop:device" });
    </script>
  </body>
</html>
