[package]
name = "lamp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
esp32 = { path = "../esp32", default-features = false }
light-protocol = { path = "../protocol" }
log = "0.4"
# Needed directly, not just through `esp32`: build.rs only gets the ESP-IDF
# linker arguments from a direct dependency.
esp-idf-svc = "0.53"
iroh = { version = "1.3", default-features = false }
irpc-iroh = "0.17"
tokio = { version = "1", features = ["sync", "time", "macros"] }
irpc = { version = "0.17", default-features = false, features = ["rpc"] }
# WiFi provisioning over BLE, sealed to the endpoint id. Not released yet.
iroh-provision = { git = "https://github.com/n0-computer/iroh-esp32-examples", rev = "55b143157bc7e62d331432260c29b28171006190", features = ["device"] }
iroh-provision-esp-idf = { git = "https://github.com/n0-computer/iroh-esp32-examples", rev = "55b143157bc7e62d331432260c29b28171006190" }

[build-dependencies]
embuild = "0.33"

# Not part of the steps' workspace (see ../Cargo.toml): Bluetooth needs its own
# ESP-IDF configuration, so this step builds ESP-IDF on its own.
[package.metadata.esp-idf-sys]
esp_idf_sdkconfig_defaults = ["../sdkconfig.defaults", "sdkconfig.defaults"]

# The same as the workspace's.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true
opt-level = 3
lto = true
codegen-units = 1

[patch.crates-io]
irpc = { git = "https://github.com/n0-computer/irpc", rev = "39de17fc19cc5c77d17be2de33523e95ab40220d" }
irpc-iroh = { git = "https://github.com/n0-computer/irpc", rev = "39de17fc19cc5c77d17be2de33523e95ab40220d" }
# esp32-nimble 0.13 doesn't build against ESP-IDF v5.5 on the C5:
# os_mempool_init got an r_ prefix there. A copy with that fixed, until it's
# upstream.
esp32-nimble = { git = "https://github.com/n0-computer/iroh-esp32-examples", rev = "55b143157bc7e62d331432260c29b28171006190" }
