[package]
name = "lamp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
esp32 = { path = "../esp32", default-features = false }
light-protocol = { path = "../protocol" }
log = "0.4"
# Needed directly, not just through `esp32`: build.rs only gets the ESP-IDF
# linker arguments from a direct dependency.
esp-idf-svc = "0.53"
iroh = { version = "1.3", default-features = false }
irpc-iroh = "0.17"
tokio = { version = "1", features = ["sync", "time", "macros"] }
irpc = { version = "0.17", default-features = false, features = ["rpc"] }
# WiFi provisioning over BLE, sealed to the endpoint id. Not released yet.
iroh-provision = { git = "https://github.com/n0-computer/iroh-esp32-examples", rev = "dbf4e3d25fe759af434d09c7b5640b7ecb978e65", features = ["device"] }
iroh-provision-esp-idf = { git = "https://github.com/n0-computer/iroh-esp32-examples", rev = "dbf4e3d25fe759af434d09c7b5640b7ecb978e65" }

[build-dependencies]
embuild = "0.33"
