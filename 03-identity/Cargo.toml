[package]
name = "identity"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
common = { path = "../common" }
light-protocol = { path = "../protocol" }
log = "0.4"
# Needed directly, not just through `common`: build.rs only gets the ESP-IDF
# linker arguments from a direct dependency.
esp-idf-svc = "0.53"
iroh = { version = "1.3", default-features = false }
irpc-iroh = "0.17"
tokio = { version = "1", features = ["sync"] }

[build-dependencies]
embuild = "0.33"
